[package]
name = "embedding-spike"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
fastembed = { version = "7.1.0", default-features = false, features = ["ort-download-binaries-rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[profile.release]
strip = true
